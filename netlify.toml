[build]
  # Writes .netlify/v1/functions/api.mjs, which serves every path (see kick-deploy.ts).
  # dist/public is an empty publish dir so no repo files are served as static.
  command = "pnpm run build:netlify && mkdir -p dist/public"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
